<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 크루 실시간 회의실 - BaroLab Master Hub</title>
  <link rel="stylesheet" href="traffic.css">
  <link rel="stylesheet" href="sidebar.css?v=20261018-anti-repeat">
  <link rel="stylesheet" href="styles.css?v=20261018-anti-repeat">
  <style>
    /* =========================================================================
       SPEC #3: Full Viewport Lock (100vh) & Isolated Inner Scroll
       - Left sidebar (#barolab-sidebar) and agent crew rail (.crew-rail) stay
         100% fixed in the viewport.
       - ONLY the right chat message stream (.chat-messages / #room-stream)
         scrolls vertically.
       ========================================================================= */
    html,
    body.control-room {
      height: 100vh !important;
      max-height: 100vh !important;
      margin: 0;
      padding: 0;
      overflow: hidden !important;
    }
    body.control-room .layout {
      height: 100vh !important;
      max-height: 100vh !important;
      min-height: 0 !important;
      overflow: hidden !important;
      display: flex !important;
    }
    body.control-room .sidebar {
      height: 100vh !important;
      max-height: 100vh !important;
      overflow-y: auto !important;
      flex-shrink: 0 !important;
    }
    body.control-room .main-wrap {
      flex: 1 1 auto !important;
      height: 100vh !important;
      max-height: 100vh !important;
      min-height: 0 !important;
      min-width: 0 !important;
      overflow: hidden !important;
      display: flex !important;
      flex-direction: column !important;
      padding: 12px 18px 14px !important;
      box-sizing: border-box !important;
      gap: 10px !important;
    }
    body.control-room .main-wrap > .header {
      flex-shrink: 0 !important;
      margin-bottom: 0 !important;
      padding: 10px 16px !important;
    }

    .chat-layout {
      flex: 1 1 0% !important;
      min-height: 0 !important;
      height: 100% !important;
      max-height: 100% !important;
      display: grid;
      grid-template-columns: 296px minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      gap: 14px;
      overflow: hidden !important;
    }
    @media (max-width: 1100px) {
      .chat-layout {
        grid-template-columns: 240px minmax(0, 1fr);
      }
    }

    /* Left Crew & Archive Rail (Fixed height, never stretches page) */
    .crew-rail {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      height: 100%;
      max-height: 100%;
      min-height: 0;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
    }
    .rail-section-title {
      font-size: 11.5px;
      font-weight: 800;
      color: #475569;
      padding: 10px 14px 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    #crew-list {
      flex-shrink: 0;
      overflow-y: auto;
      max-height: 54%;
    }
    .crew-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      cursor: pointer;
      border-bottom: 1px solid #f1f5f9;
      transition: all 0.15s ease;
      position: relative;
      border-left: 3px solid transparent;
    }
    .crew-card:hover { background: #f8fafc; }
    .crew-card.active-filter {
      background: #eff6ff;
      border-left-color: #2563eb;
    }
    .crew-card.is-typing {
      background: #eff6ff;
      border-left: 3px solid #2563eb;
    }
    .crew-avatar {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      flex-shrink: 0;
      position: relative;
    }
    .crew-live-dot {
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #10b981;
      border: 2px solid #ffffff;
      transition: background 0.25s ease;
    }
    .crew-card.is-typing .crew-live-dot {
      background: #f59e0b !important;
      animation: pulseDot 1s infinite ease-in-out;
    }
    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.7; }
    }
    .crew-info { flex: 1; min-width: 0; }
    .crew-info strong {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12.5px;
      color: #0f172a;
      flex-wrap: wrap;
    }
    .crew-info small.crew-live-status {
      display: block;
      font-size: 11px;
      color: #334155;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .crew-card.is-typing .crew-info small.crew-live-status {
      color: #1d4ed8;
      font-weight: 800;
    }
    .brain-chip {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 1px 6px;
      border-radius: 999px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #334155;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .crew-mention-mini {
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      color: #475569;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.12s;
    }
    .crew-mention-mini:hover {
      background: #dbeafe;
      border-color: #93c5fd;
      color: #1d4ed8;
    }

    .archive-list {
      flex: 1 1 0%;
      min-height: 0;
      overflow-y: auto;
      padding: 4px 8px 10px;
    }
    .archive-item {
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 4px;
      border: 1px solid transparent;
      transition: background 0.12s;
    }
    .archive-item:hover { background: #f8fafc; border-color: #e2e8f0; }
    .archive-item strong { display: block; font-size: 12px; color: #1e293b; }
    .archive-item small { font-size: 10.5px; color: #64748b; }

    /* Center Room Panel (Fixed height, internal scroll on .chat-messages only) */
    .room-panel {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      height: 100%;
      max-height: 100%;
      min-height: 0;
      overflow: hidden;
      position: relative;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
    }

    /* Participant filters stay separate from the conversation. */
    .chat-smart-filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 16px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .agent-filter-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .agent-filter-tab {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      color: #475569;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .agent-filter-tab:hover {
      border-color: #93c5fd;
      color: #1e40af;
      background: #eff6ff;
    }
    .agent-filter-tab.active {
      background: #0f172a;
      border-color: #0f172a;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.16);
    }
    .agent-filter-tab .tab-cnt {
      padding: 0 5px;
      border-radius: 999px;
      font-size: 10.5px;
      background: rgba(148, 163, 184, 0.22);
      color: inherit;
    }
    .agent-filter-tab.active .tab-cnt {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
    }
    .filter-right-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
    .ceo-direct-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #334155;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .ceo-direct-toggle-btn:hover {
      border-color: #2563eb;
      background: #eff6ff;
      color: #1e40af;
    }
    .ceo-direct-toggle-btn.active {
      background: linear-gradient(90deg, #1d4ed8 0%, #2563eb 100%);
      border-color: #1d4ed8;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
    }
    .ceo-toggle-pill {
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 900;
      background: #e2e8f0;
      color: #475569;
    }
    .ceo-direct-toggle-btn.active .ceo-toggle-pill {
      background: #ffffff;
      color: #1d4ed8;
    }
    .msg-row.is-hidden-by-filter {
      display: none !important;
    }
    .msg-row.workstream-row .msg-bubble {
      background: #ffffff;
      border-left: 0;
    }
    .workstream-tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 1px 7px;
      border-radius: 999px;
      background: #e0f2fe;
      border: 1px solid #7dd3fc;
      color: #0369a1;
      font-size: 10.5px;
      font-weight: 800;
    }
    .inline-mention-pill {
      display: inline-flex;
      align-items: center;
      padding: 0 6px;
      border-radius: 6px;
      background: #dbeafe;
      color: #1d4ed8;
      font-weight: 800;
      font-size: 12.5px;
    }

    .room-stream,
    .chat-messages {
      flex: 1 1 0%;
      min-height: 0;
      overflow-y: auto;
      padding: 18px 22px 24px;
      background: #b2c7d9;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: auto;
      overflow-anchor: none;
    }

    /* =========================================================================
       SPEC #4: Clean Messenger Bubbles (KakaoTalk / Slack Style)
       - Removed cluttered gray 'Reaction Round' banners & 2-line gray tracker boxes.
       - Clean bubble + sleek 1-line status bar (.msg-status-line) at bottom.
       ========================================================================= */
    .msg-row {
      display: flex;
      gap: 10px;
      max-width: min(88%, 760px);
      width: fit-content;
      align-items: flex-start;
      animation: msgFadeIn 0.18s ease-out;
      flex-shrink: 0;
    }
    @keyframes msgFadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .msg-row.pinned-anchor .msg-bubble {
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.32), 0 4px 12px rgba(15, 23, 42, 0.06);
    }
    .msg-col {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 0 1 auto;
    }
    .msg-head {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      font-size: 12px;
    }
    .msg-bubble {
      background: #ffffff;
      border: 0;
      border-radius: 4px 12px 12px 12px;
      position: relative;
      min-width: 0;
      padding: 11px 15px;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.04);
      font-size: 13.5px;
      line-height: 1.62;
      color: #0f172a;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-row.user .msg-bubble {
      background: #fee500;
      border-color: #fee500;
      border-radius: 12px 4px 12px 12px;
      color: #191919;
    }

    /* Compact 1-Line Footer Status Bar inside Agent Bubble */
    .msg-status-line {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px dashed #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      overflow: hidden;
      font-size: 11.5px;
      color: #64748b;
      white-space: nowrap;
    }
    .msg-status-line .st-handoff {
      font-weight: 700;
      color: #334155;
      flex-shrink: 0;
    }
    .msg-status-line .st-state {
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .msg-status-line .st-state.processing { color: #b45309; }
    .msg-status-line:has(.st-linkage) {
      flex-wrap: wrap;
      white-space: normal;
      overflow: visible;
    }
    .msg-status-line .st-linkage {
      display: grid;
      flex: 1 1 100%;
      min-width: 0;
      gap: 3px;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .msg-status-line .st-state.completed { color: #059669; }
    .msg-status-line .st-state.failed { color: #dc2626; }
    .msg-status-line .st-link {
      color: #2563eb;
      font-weight: 700;
      text-decoration: none;
      flex-shrink: 0;
    }
    .msg-status-line .st-link:hover {
      text-decoration: underline;
    }
    .msg-status-actions {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .btn-inline-memory-save {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 9px;
      border-radius: 6px;
      border: 1px solid #c7d2fe;
      background: #eef2ff;
      color: #3730a3;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.14s ease;
      text-decoration: none;
    }
    .btn-inline-memory-save:hover {
      background: #e0e7ff;
      border-color: #818cf8;
      color: #1e1b4b;
    }
    .btn-inline-memory-save.is-saved {
      border-color: #a7f3d0;
      background: #ecfdf5;
      color: #065f46;
    }

    .artifact-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      color: #1d4ed8;
      font-size: 11.5px;
      font-weight: 700;
      text-decoration: none;
    }
    .exec-tool-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 6px;
      padding: 4px 10px;
      background: linear-gradient(90deg, #ecfdf5 0%, #f0fdf4 100%);
      border: 1px solid #6ee7b7;
      border-radius: 7px;
      color: #065f46;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.4;
      box-shadow: 0 1px 3px rgba(5, 150, 105, 0.1);
    }
    .st-state.status_only {
      color: #b45309;
      background: #fffbeb;
      border: 1px solid #fcd34d;
      padding: 2px 7px;
      border-radius: 5px;
      font-weight: 800;
    }
    .execution-receipt-box {
      margin-top: 10px;
      background: #0f172a;
      border: 1px solid #334155;
      border-left: 4px solid #10b981;
      border-radius: 8px;
      padding: 9px 12px;
      color: #e2e8f0;
      font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace;
      font-size: 11.5px;
      line-height: 1.45;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.16);
    }
    .execution-receipt-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      padding-bottom: 6px;
      margin-bottom: 6px;
      border-bottom: 1px dashed #334155;
    }
    .execution-receipt-title {
      color: #34d399;
      font-weight: 800;
      font-size: 11.5px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .execution-receipt-pid {
      background: #1e293b;
      border: 1px solid #475569;
      color: #38bdf8;
      padding: 1px 7px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 700;
    }
    .execution-receipt-cmd {
      color: #fde047;
      font-weight: 700;
      margin-bottom: 6px;
      word-break: break-all;
    }
    .execution-receipt-stdout {
      margin: 0;
      padding: 7px 9px;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 6px;
      color: #cbd5e1;
      font-family: inherit;
      font-size: 11px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 185px;
      overflow-y: auto;
    }
    .kst-clock-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: 8px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #38bdf8;
      font-size: 11.5px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    /* Real-Time Typing Bubble Indicator */
    .typing-stream-zone {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 4px 22px 8px;
      background: #b2c7d9;
      flex-shrink: 0;
    }
    .typing-stream-zone:empty {
      display: none;
      padding: 0;
    }
    .typing-bubble-row {
      display: flex;
      align-items: center;
      gap: 10px;
      animation: msgFadeIn 0.15s ease-out;
    }
    .typing-bubble-card {
      background: #ffffff;
      border: 1px solid #93c5fd;
      border-radius: 12px;
      padding: 7px 13px;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.08);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 700;
      color: #1e3a8a;
    }
    .typing-dots {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .typing-dots span {
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: #2563eb;
      display: inline-block;
      animation: typingBounce 1.2s infinite ease-in-out;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-4px); opacity: 1; }
    }

    /* Smart Scroll Floating Pill */
    .floating-new-msg-btn {
      position: absolute;
      bottom: 112px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: linear-gradient(90deg, #1d4ed8, #2563eb);
      color: #ffffff;
      border: 1px solid #93c5fd;
      border-radius: 999px;
      padding: 7px 16px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(29, 78, 216, 0.28);
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .floating-new-msg-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    /* Composer Area (Fixed at bottom of room-panel) */
    .composer-area {
      padding: 10px 16px;
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
    .mention-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 7px;
      flex-wrap: wrap;
    }
    .mention-pills-left {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }
    .mention-pill {
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      font-size: 11.5px;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
      transition: all 0.12s;
    }
    .mention-pill:hover { border-color: #2563eb; color: #2563eb; background: #eff6ff; }
    .scroll-lock-indicator {
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .composer-row {
      display: flex;
      gap: 10px;
    }
    .composer-input {
      flex: 1;
      padding: 9px 13px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 13.5px;
      font-family: inherit;
      resize: none;
    }
    .composer-input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    .btn-send {
      padding: 0 20px;
      background: #fee500;
      color: #191919;
      border: none;
      border-radius: 10px;
      font-weight: 800;
      font-size: 13.5px;
      cursor: pointer;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .btn-send:hover { background: #f3d900; }
    .btn-send:disabled { background: #94a3b8; cursor: not-allowed; }

    .btn-patrol-trigger {
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      border: 1px solid #0d9488;
      background: #f0fdfa;
      color: #0f766e;

<script>
(() => {
  const AGENT_STYLE = {
    jarvis: { name: '팀장', badge: '운영총괄', color: '#2563eb', short: 'J', icon: '🧭', title: '운영총괄 AI', defaultBrain: 'Argon High' },
    doctor: { name: '닥터', badge: '콘텐츠감사', color: '#0d9488', short: 'D', icon: '🩺', title: '콘텐츠 감사·재생 전담', defaultBrain: '3.8 Flash' },
    publi:  { name: '퍼블리', badge: '발행검수', color: '#059669', short: 'P', icon: '🤖', title: '블로그 발행·예약 검수 전문가', defaultBrain: 'gpt-6.1-sol' },
    trace:  { name: '트레이스', badge: '성과분석', color: '#7c3aed', short: 'T', icon: '📊', title: '색인·트래픽·수익 분석 전문가', defaultBrain: '3.8 Flash' },
    patch:  { name: '패치', badge: '자동화개발', color: '#d97706', short: 'C', icon: '⚙️', title: '대시보드·파이프라인 개발·유지보수', defaultBrain: 'gpt-6.1-sol' },
    radar:  { name: '레이더', badge: '수익전략', color: '#e11d48', short: 'R', icon: '🎯', title: '신사업 아이템 · 마케팅 기법 · 트렌드 자율 발굴', defaultBrain: 'Argon Med' },
  };

  const ALIAS_TO_SLUG = {
    jarvis: 'jarvis', '팀장': 'jarvis', '자비스': 'jarvis',
    publi: 'publi', '퍼블리': 'publi',
    trace: 'trace', '트레이스': 'trace',
    patch: 'patch', '패치': 'patch',
    radar: 'radar', '레이더': 'radar',
    doctor: 'doctor', '닥터': 'doctor',
  };

  let resolvedApiBase = '';
  let lastEventSeq = 0;
  let eventEpoch = '';
  let eventReconnectTimer = null;
  let sseSource = null;
  const activeTypingMap = new Map();
  const agentBrainBadgeMap = new Map();

  // =========================================================================
  // SPEC #2 & #3: Set-based Message ID Deduplication + Smart Filter State
  // =========================================================================
  const renderedMessageIds = new Set();
  const messageStore = new Map();
  let activeAgentFilter = 'all';
  let ceoOnlyFilterActive = false;
  document.getElementById('show-work-records').addEventListener('click', () => {
    document.getElementById('work-records-agent').value = activeAgentFilter;
    renderWorkRecords();
    document.getElementById('work-records-dialog').showModal();
  });
  document.getElementById('close-work-records').addEventListener('click', () => document.getElementById('work-records-dialog').close());
  document.getElementById('work-records-agent').addEventListener('change', renderWorkRecords);

  let pinnedUserRowId = null;
  let unreadBelowCount = 0;
  const streamEl = document.getElementById('room-stream');
  const typingZoneEl = document.getElementById('typing-stream-zone');
  const floatingBtnEl = document.getElementById('btn-floating-new-msg');
  const scrollLockStatusEl = document.getElementById('scroll-lock-status');

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  function extractMentionsFromText(text) {
    const out = new Set();
    const raw = String(text || '');
    const regex = /@(jarvis|publi|trace|patch|radar|doctor|팀장|자비스|퍼블리|트레이스|패치|레이더|닥터)/gi;
    let match;
    while ((match = regex.exec(raw)) !== null) {
      const slug = ALIAS_TO_SLUG[match[1].toLowerCase()];
      if (slug) out.add(slug);
    }
    return Array.from(out);
  }

  function formatBodyText(text) {
    let safe = escapeHtml(text);
    safe = safe.replace(/\*\*(\[실행 완료:[^\]]+\])\*\*/g, '<span class="exec-tool-badge">⚡ $1</span>');
    safe = safe.replace(/(^|\n)(\[실행 완료:[^\]]+\])/g, '$1<span class="exec-tool-badge">⚡ $2</span>');
    safe = safe.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    safe = safe.replace(/`([^`]+)`/g, '<code style="background:#f1f5f9; padding:1px 5px; border-radius:4px; font-size:12.5px; color:#0f172a;">$1</code>');
    safe = safe.replace(/@(jarvis|publi|trace|patch|radar|doctor|팀장|자비스|퍼블리|트레이스|패치|레이더|닥터)/gi, '<span class="inline-mention-pill">@$1</span>');
    safe = safe.replace(/\[([^\]]+)\]\((?:&lt;)?(?:\/\/otns\/yoonlab\/10_Project\/BaroLab\/)?vault\/([^)&>]+)(?:&gt;)?\)/g,
      '<a href="memory.html?rel=$2" class="artifact-chip">📄 $1</a>');
    return safe;
  }

  function formatTime(ts) {
    if (!ts) return '';
    const d = new Date(Number(ts));
    if (isNaN(d.getTime())) return '';
    return d.toLocaleString('ko-KR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  function isUserNearBottom(threshold = 95) {
    return (streamEl.scrollHeight - streamEl.scrollTop - streamEl.clientHeight) <= threshold;
  }

  function updateFloatingNewMsgButton() {
    if (unreadBelowCount > 0) {
      floatingBtnEl.innerHTML = `<span>↓ 새로운 대화 ${unreadBelowCount}건 도착 (클릭 시 이동)</span>`;
      floatingBtnEl.classList.add('visible');
    } else {
      floatingBtnEl.classList.remove('visible');
    }
  }

  let followLatest = true;
  let followFrame = null;
  let userScrollUntil = 0;
  let lastScrollTop = streamEl.scrollTop;
  let touchY = null;

  function scheduleFollowLatest() {
    if (!followLatest || followFrame !== null) return;
    followFrame = requestAnimationFrame(() => {
      followFrame = null;
      if (!followLatest) return;
      streamEl.scrollTop = streamEl.scrollHeight;
      lastScrollTop = streamEl.scrollTop;
    });
  }

  function pauseLatestFollow() {
    followLatest = false;
    scrollLockStatusEl.textContent = '📖 이전 대화 읽는 중';
  }

  function resumeLatestFollow() {
    followLatest = true;
    unreadBelowCount = 0;
    updateFloatingNewMsgButton();
    scrollLockStatusEl.textContent = '↓ 최신 대화 자동 표시';
    scheduleFollowLatest();
  }

  floatingBtnEl.addEventListener('click', resumeLatestFollow);
  streamEl.addEventListener('wheel', event => {
    userScrollUntil = performance.now() + 1500;
    if (event.deltaY < 0) pauseLatestFollow();
  }, { passive: true });
  streamEl.addEventListener('touchstart', event => {
    touchY = event.touches[0]?.clientY ?? null;
  }, { passive: true });
  streamEl.addEventListener('touchmove', event => {
    const nextY = event.touches[0]?.clientY;
    userScrollUntil = performance.now() + 1500;
    if (touchY !== null && nextY > touchY) pauseLatestFollow();
    touchY = nextY ?? null;
  }, { passive: true });
  streamEl.addEventListener('pointerdown', () => {
    userScrollUntil = performance.now() + 1500;
  }, { passive: true });
  streamEl.addEventListener('keydown', event => {
    if (event.target.closest('input, textarea, [contenteditable="true"]')) return;
    userScrollUntil = performance.now() + 1500;
    if (['ArrowUp', 'PageUp', 'Home'].includes(event.key) || (event.key === ' ' && event.shiftKey)) {
      pauseLatestFollow();
    }
  });
  streamEl.addEventListener('scroll', () => {
    const currentTop = streamEl.scrollTop;
    if (performance.now() < userScrollUntil) {
      if (currentTop < lastScrollTop - 1) pauseLatestFollow();
      else if (isUserNearBottom(4)) resumeLatestFollow();
    }
    lastScrollTop = currentTop;
  }, { passive: true });

  // One coalesced frame covers streaming, edits, filters and late image loading.
  new MutationObserver(scheduleFollowLatest).observe(streamEl, {
    childList: true, subtree: true, characterData: true,
  });
  streamEl.addEventListener('load', scheduleFollowLatest, true);
  new ResizeObserver(scheduleFollowLatest).observe(streamEl);

  function handleSmartScrollOnNewMessage(rowEl, isUserOwnMessage, wasNearBottom) {
    if (followLatest) scheduleFollowLatest();
    else {
      unreadBelowCount += 1;
      updateFloatingNewMsgButton();
    }
  }

  // =========================================================================
  // SPEC #3: Smart Filter Engine (Per-Agent Filter + CEO Direct Filter)
  // =========================================================================
  function isMessageWorkstream(m) {
    if (!m || m.who === 'user') return false;
    const mid = String(m.id || '');
    return Boolean(
      m.isWorkstream === true ||
      m.msgKind === 'workstream' ||
      m.replyToCeo === false ||
      mid.startsWith('ws-') ||
      mid.startsWith('msg-doctor-patrol-') ||
      m.eventType === 'pipeline_workstream' ||
      m.eventType === 'content_doctor_patrol'
    );
  }

  function workActorDisplay(m) {
    const staff = ['jarvis','publi','trace','patch','radar','doctor'];
    if (staff.includes(m.who) || m.who === 'user') return {owner: m.who, tool: '', historical: false};
    let owner = staff.includes(m.ownerAgent) ? m.ownerAgent : '';
    // Historical projection only: the persisted actor and model evidence stay untouched.
    if (!owner && m.eventType === 'crew_work_event') {
      const match = /^(cf|naver)-(keyword-selector|researcher|writer|image-maker|assembler|reviewer)$/.exec(m.who || '');
      if (match) owner = match[2] === 'keyword-selector' ? 'radar' : 'publi';
      else if (['cf-pipeline','naver-pipeline','kin_pipeline','threads_pipeline','kin-pipeline','threads-pipeline'].includes(m.who)) owner = 'publi';
    }
    return {owner, tool: m.toolActor || m.who || 'unknown', historical: !!owner && !m.ownerAgent};
  }

  function doesMessageInvolveAgent(m, slug) {
    if (!m || !slug || slug === 'all') return true;
    if (m.who === slug || workActorDisplay(m).owner === slug) return true;
    if (m.targetAgent === slug) return true;
    if (m.requestedTo === slug) return true;
    if (Array.isArray(m.mentionedAgents) && m.mentionedAgents.includes(slug)) return true;
    const mentions = extractMentionsFromText(m.text || '');
    if (mentions.includes(slug)) return true;
    if (m.taskTracker && m.taskTracker.handoff) {
      const handoffMentions = extractMentionsFromText(m.taskTracker.handoff);
      if (handoffMentions.includes(slug)) return true;
    }
    return false;
  }

  function doesMessageMatchFilters(m, agentFilter, ceoOnly) {
    if (!m) return false;
    if (!isConversationMessage(m)) return false;
    const isWs = isMessageWorkstream(m);
    if (ceoOnly && isWs) {
      return false;
    }
    if (agentFilter && agentFilter !== 'all') {
      if (doesMessageInvolveAgent(m, agentFilter)) return true;
      // Also include user message if the immediately following agent reply was from `agentFilter`
      if (m.who === 'user' && m._repliedBySlugs && m._repliedBySlugs.has(agentFilter)) {
        return true;
      }
      return false;
    }
    return true;
  }

  function recomputeUserReplyLinks() {
    let lastUserMsg = null;
    for (const m of chronologicalMessages(messageStore.values())) {
      if (m.who === 'user') {
        m._repliedBySlugs = new Set(extractMentionsFromText(m.text || ''));
        lastUserMsg = m;
      } else if (lastUserMsg && !isMessageWorkstream(m)) {
        lastUserMsg._repliedBySlugs.add(m.who);
      }
    }
  }

  function applyChatFilters() {
    recomputeUserReplyLinks();

    // Update counts on tabs
    const counts = { all: 0, jarvis: 0, publi: 0, trace: 0, patch: 0, radar: 0, doctor: 0 };
    for (const m of messageStore.values()) {
      if (doesMessageMatchFilters(m, 'all', ceoOnlyFilterActive)) {
        counts.all += 1;
      }
      for (const slug of ['jarvis', 'publi', 'trace', 'patch', 'radar', 'doctor']) {
        if (doesMessageMatchFilters(m, slug, ceoOnlyFilterActive)) {
          counts[slug] += 1;
        }
      }
    }

    document.querySelectorAll('.agent-filter-tab').forEach(tab => {
      const slug = tab.dataset.agentFilter || 'all';
      tab.classList.toggle('active', slug === activeAgentFilter);
      const cntEl = tab.querySelector('[data-cnt-for]');
      if (cntEl && typeof counts[slug] === 'number') {
        cntEl.textContent = String(counts[slug]);
      }
    });

    document.querySelectorAll('.crew-card').forEach(card => {
      card.classList.toggle('active-filter', card.dataset.slug === activeAgentFilter);
    });

    const ceoBtn = document.getElementById('btn-ceo-only-filter');
    const ceoPill = document.getElementById('ceo-only-pill');
    if (ceoBtn) {
      ceoBtn.classList.toggle('active', ceoOnlyFilterActive);
      ceoBtn.setAttribute('aria-pressed', ceoOnlyFilterActive ? 'true' : 'false');
    }
    if (ceoPill) {
      ceoPill.textContent = ceoOnlyFilterActive ? 'ON' : 'OFF';
    }

    streamEl.querySelectorAll('.msg-row[data-msg-id]').forEach(rowEl => {
      const mid = rowEl.dataset.msgId;
      const m = messageStore.get(mid);
      const visible = m ? doesMessageMatchFilters(m, activeAgentFilter, ceoOnlyFilterActive) : true;
      rowEl.classList.toggle('is-hidden-by-filter', !visible);
    });
  }

  function setAgentFilter(slug) {
    if (!slug || slug === 'all') {
      activeAgentFilter = 'all';
    } else {
      activeAgentFilter = (activeAgentFilter === slug) ? 'all' : slug;
    }
    applyChatFilters();
  }

  function toggleCeoOnlyFilter() {
    ceoOnlyFilterActive = !ceoOnlyFilterActive;
    applyChatFilters();
  }

  document.querySelectorAll('.agent-filter-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const target = tab.dataset.agentFilter || 'all';
      if (target === 'all') {
        activeAgentFilter = 'all';
        applyChatFilters();
      } else {
        setAgentFilter(target);
      }
    });
  });

  const btnCeoOnly = document.getElementById('btn-ceo-only-filter');
  if (btnCeoOnly) {
    btnCeoOnly.addEventListener('click', toggleCeoOnlyFilter);
  }

  // =========================================================================
  // SPEC #3 & #4: Execution Receipt Box + 1-Line Status Bar inside Message Bubble
  // =========================================================================
  function buildExecutionReceiptBoxHtml(m) {
    if (!m || m.who === 'user') return '';
    const receipts = Array.isArray(m.executionReceipts) && m.executionReceipts.length
      ? m.executionReceipts
      : (m.taskTracker && Array.isArray(m.taskTracker.executionReceipts) ? m.taskTracker.executionReceipts : []);
    if (!receipts.length) return '';

    return receipts.map(rec => {
      if (!rec || !rec.cmd) return '';
      const cmd = escapeHtml(rec.cmd || '');
      const pid = escapeHtml(String(rec.pid != null ? rec.pid : '-'));
      const exitCode = escapeHtml(String(rec.exit_code != null ? rec.exit_code : 'unknown'));
      const rawTail = Array.isArray(rec.stdout_tail) ? rec.stdout_tail.join('\n') : String(rec.stdout_tail || '');
      const stdoutTail = escapeHtml(rawTail.trim() || '[콘솔 출력 없음]');
      return `
        <div class="execution-receipt-box" data-testid="execution-receipt-box">
          <div class="execution-receipt-header">
            <span class="execution-receipt-title">🧾 [실행 영수증 (Execution Receipt)] 서버 CLI 실측 검증</span>
            <span class="execution-receipt-pid">PID: ${pid} · Exit Code: ${exitCode}</span>
          </div>
          <div class="execution-receipt-cmd">$ ${cmd}</div>
          <pre class="execution-receipt-stdout">${stdoutTail}</pre>
        </div>
      `;
    }).join('');
  }

  function buildStatusLineHtml(m) {
    const tt = m.taskTracker;
    const artifacts = m.artifacts || [];
    if (!tt && !artifacts.length && m.who === 'user') return '';

    const handoff = (tt && tt.handoff) ? tt.handoff : '';
    const status = (tt && tt.status) || 'status_only';
    const summary = (tt && (tt.resultSummary || tt.step)) || '결과 상태 미관측';
    const deliverableUrl = (tt && tt.deliverableUrl) || (artifacts.length ? `memory.html?rel=${encodeURIComponent(artifacts[0])}` : '');
    const deliverableLabel = (tt && tt.deliverableLabel) || (artifacts.length ? String(artifacts[0]).split('/').pop() : '');
    const isSynapseSaved = Boolean((tt && tt.synapseLinked) || m.synapseSaved);

    let stateText = escapeHtml(summary);
    if (status === 'completed') stateText = `✅ ${escapeHtml(summary)}`;
    if (status === 'processing') {
      stateText = `🔄 ${escapeHtml((tt && tt.step) || '처리 중...')}`;
    } else if (status === 'failed') {
      stateText = `🔴 ${escapeHtml(summary)}`;
    } else if (status === 'status_only') {
      stateText = `${escapeHtml(summary)}`;
    }

    const showMemorySaveBtn = (m.who === 'radar' || artifacts.length > 0 || (m.text && m.text.length >= 90));
    const memoryBtnHtml = showMemorySaveBtn
      ? `<button type="button" class="btn-inline-memory-save ${isSynapseSaved ? 'is-saved' : ''}" data-save-msg-id="${escapeHtml(m.id || '')}" data-save-who="${escapeHtml(m.who || 'radar')}" title="이 분석 내용을 기억 그래프(memory.html)에 시냅스 노드로 즉시 저장합니다">${isSynapseSaved ? '[✦ 기억 그래프에 반영됨]' : '[✦ 기억 그래프에 반영]'}</button>`
      : '';
    const recipientNames = { jarvis: '팀장', patch: '패치', publi: '퍼블리', trace: '트레이스', radar: '레이더', doctor: '닥터' };
    const recipientLabel = Object.hasOwn(recipientNames, m.requestedTo) ? `@${recipientNames[m.requestedTo]}` : m.requestedTo;
    const actorDisplay = workActorDisplay(m);
    const linkage = [['실행 도구', actorDisplay.tool], ['귀속 근거', actorDisplay.historical ? '과거 기록 역할 분류' : actorDisplay.tool && actorDisplay.owner ? '실행 소유 직원' : actorDisplay.tool ? '담당 미지정' : ''], ['단계', m.stage], ['작업', m.taskId], ['요청 대상', recipientLabel], ['상위 요청', m.parentRequestId], ['반환 유형', m.outputKind], ['근거', m.evidenceId]]
      .filter(([, value]) => value).map(([label, value]) => `<span>${escapeHtml(label)}: ${escapeHtml(String(value))}</span>`).join('');

    return `
      <div class="msg-status-line" data-tracker-for="${escapeHtml(m.id || '')}">
        ${handoff ? `<span class="st-handoff">📋 ${escapeHtml(handoff)}</span><span>·</span>` : ''}
        <span class="st-state ${escapeHtml(status)}">${stateText}</span>
        ${linkage ? `<span class="st-linkage">${linkage}</span>` : ''}
        <span class="msg-status-actions">
          ${deliverableUrl ? `<a class="st-link" href="${escapeHtml(deliverableUrl)}">🔗 ${escapeHtml(deliverableLabel || '상세')}</a>` : ''}
          ${memoryBtnHtml}
        </span>
      </div>
    `;
  }

  document.addEventListener('click', async e => {
    if (!e.target.closest('#room-stream, #work-records-dialog')) return;
    const saveBtn = e.target.closest('.btn-inline-memory-save');
    if (!saveBtn) return;
    e.preventDefault();
    const msgId = saveBtn.dataset.saveMsgId || '';
    const who = saveBtn.dataset.saveWho || 'radar';
    const rowEl = saveBtn.closest('.msg-row');
    const bubbleEl = rowEl ? rowEl.querySelector('.msg-bubble') : null;
    const rawText = bubbleEl ? bubbleEl.innerText.split('\n📋')[0].trim() : '';

    saveBtn.disabled = true;
    saveBtn.textContent = '[✦ 기억 그래프 반영 중...]';
    try {
      const res = await apiFetch('/api/chat/save-to-memory', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messageId: msgId, who, text: rawText }),
      });
      const out = await res.json();
      if (out && out.ok) {
        saveBtn.classList.add('is-saved');
        saveBtn.textContent = '[✦ 기억 그래프에 반영됨]';
        const actionsWrap = saveBtn.closest('.msg-status-actions');
        if (actionsWrap && out.url && !actionsWrap.querySelector('.st-link')) {
          const linkEl = document.createElement('a');
          linkEl.className = 'st-link';
          linkEl.href = out.url;
          linkEl.textContent = `🔗 ${(out.rel || '').split('/').pop() || '노트 보기'}`;
          actionsWrap.insertBefore(linkEl, saveBtn);
        }
      } else {
        saveBtn.textContent = '[✦ 기억 그래프에 반영]';
      }
    } catch (_) {
      saveBtn.textContent = '[✦ 기억 그래프에 반영]';
    } finally {
      saveBtn.disabled = false;
    }
  });

  function isNoiseMessage(m) {
    if (!m || !m.text) return true;
    if (m.eventType === 'crew_work_event' && m.taskId && m.eventId) return false;
    const mid = String(m.id || '');
    const who = String(m.who || '');
    const txt = String(m.text || '');
    if (who === 'system') return true;
    if (mid.startsWith('auto-') || mid.startsWith('sys-')) return true;
    if (mid === 'msg-1792329008504-publi-0' || mid === 'msg-1792329010530-jarvis-1') return true;
    if (m.capReached || m.round === 2) return true;
    if (txt.includes('반응 라운드') || txt.includes('순차 티키타카 협업 라인업') || txt.includes('2라운드 티키타카')) return true;
    if (who !== 'user' && (txt.includes('98.2%') || txt.includes('10월 22일') || txt.includes('10월 23일') || txt.includes('10월 27일') || txt.includes('서치어드바이저에서 색인 가능 여부를 확인한 결과'))) return true;
    if (who !== 'radar' && who !== 'user' && (txt.includes('10일 만에 180만원') || txt.includes('알파남'))) return true;
    return false;
  }

  function getAgentBrainBadge(m) {
    if (m && m.brain && m.brain.badge) return m.brain.badge;
    const slug = m ? m.who : '';
    if (agentBrainBadgeMap.has(slug)) return agentBrainBadgeMap.get(slug);
    return (AGENT_STYLE[slug] && AGENT_STYLE[slug].defaultBrain) || '모델 미관측';
  }

  function crewConversationText(m) {
    const staff = ['jarvis','publi','trace','patch','radar','doctor'];
    const reply = m.outputKind;
    const validText = typeof reply === 'string' && reply.trim() && reply.length <= 160 && !/[\x00-\x1f]/.test(reply);
    if (m.eventType === 'crew_work_event' && staff.includes(m.who)
        && ['style-strategy-discussion','post-style-planning'].includes(m.stage)
        && m.phase === 'completed' && m.messageKind === 'staff_reply'
        && typeof m.model === 'string' && m.model.trim() && validText) return reply;
    if (m.eventType === 'crew_work_event' && m.who === 'jarvis' && ['project-result-reviewed','project-instruction-issued'].includes(m.stage)
        && m.phase === 'completed' && m.messageKind === 'staff_reply'
        && typeof m.model === 'string' && m.model.trim() && validText) return reply;
    if (m.eventType === 'crew_work_event' && staff.includes(m.who)
        && ['staff-response','staff-terminal-response','staff-report-format-followup'].includes(m.stage) && m.phase === 'completed'
        && typeof m.model === 'string' && m.model.trim()
        && typeof reply === 'string' && reply.trim() && reply.length <= 120
        && !/[\x00-\x1f]/.test(reply)) return reply;
    return null;
  }

  function isConversationMessage(m) {
    if (!m) return false;
    if (m.who === 'user') return true;
    if (m.eventType === 'crew_work_event') return crewConversationText(m) !== null;
    return ['jarvis','publi','trace','patch','radar','doctor'].includes(m.who)
      && !isMessageWorkstream(m) && !m.autonomous
      && (!m.eventType || m.eventType === 'chat');
  }

  function renderWorkRecords() {
    const agent = document.getElementById('work-records-agent').value;
    const rows = chronologicalMessages(messageStore.values()).filter(m => m.who !== 'user' && doesMessageInvolveAgent(m, agent));
    document.getElementById('work-records-list').innerHTML = rows.map(m => {
      const owner = workActorDisplay(m).owner;
      const name = AGENT_STYLE[owner]?.name || '담당 미지정';
      return `<details style="margin-top:12px"><summary>${escapeHtml(name)} · ${escapeHtml(m.stage || m.eventType || '대화 실행 근거')} · ${formatTime(m.ts)}</summary><div>${formatBodyText(m.text)}${buildExecutionReceiptBoxHtml(m)}${buildStatusLineHtml(m)}</div></details>`;
    }).join('') || '<p>해당 직원의 업무 기록이 없습니다.</p>';
  }

  function articleLinkHtml(m) {
    const address = m.deliverableUrl || m.taskTracker?.deliverableUrl;
    if (!address) return '';
    try {
      const url = new URL(address);
      if (url.protocol !== 'https:' || url.username || url.password) return '';
      const label = m.deliverableLabel || m.taskTracker?.deliverableLabel || (m.who === 'doctor' ? '수정 대상 글 열기' : '대상 게시물 열기');
      return `<a class="article-work-link" href="${escapeHtml(url.href)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)} ↗<small>${escapeHtml(url.hostname)}</small></a>`;
    } catch { return ''; }
  }

  function messageBodyText(m) {
    return crewConversationText(m) ?? m.text;
  }

  function buildMessageRowHtml(m) {
    if (!isConversationMessage(m)) return '';
    const mid = escapeHtml(m.id || `msg-${m.ts}-${m.who}`);
    if (m.who === 'user') {
      const isPinned = (pinnedUserRowId && pinnedUserRowId === (m.id || `msg-${m.ts}-${m.who}`));
      return `
        <div class="msg-row user ${isPinned ? 'pinned-anchor' : ''}" data-msg-id="${mid}" data-who="user" data-reply-to-ceo="true">
          <div class="crew-avatar" style="background:#0f172a;">윤</div>
          <div class="msg-col">
            <div class="msg-head" style="justify-content:flex-end;">
              <strong style="color:#0f172a;">윤대표-CEO</strong>
            </div>
            <div class="msg-content"><div class="msg-bubble">${formatBodyText(m.text)}</div><time class="msg-time" title="${formatTime(m.ts)}">${new Date(Number(m.ts)).toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'})}</time></div>
          </div>
        </div>
      `;
    }
    const actorDisplay = workActorDisplay(m);
    const ownerStyle = AGENT_STYLE[actorDisplay.owner];
    const ag = actorDisplay.tool
      ? { ...(ownerStyle || {color:'#475569',short:'·'}), name: ownerStyle ? ownerStyle.name + ' 담당 · 도구 실행 관측' : '담당 미지정 · 도구 실행 관측', badge:'직원 직접 발언 아님' }
      : AGENT_STYLE[m.who] || {name:'관측 기록',badge:'관측 기록',color:'#475569',short:'·'};
    const brainBadge = getAgentBrainBadge(m);
    const isWs = isMessageWorkstream(m);
    return `
      <div class="msg-row ${isWs ? 'workstream-row' : ''}" data-msg-id="${mid}" data-agent="${escapeHtml(actorDisplay.owner || 'tool-observation')}" data-is-workstream="${isWs ? 'true' : 'false'}" data-reply-to-ceo="${isWs ? 'false' : 'true'}">
        <div class="crew-avatar" style="background:${ag.color};">${ag.short}</div>
        <div class="msg-col">
          <div class="msg-head">
            <strong style="color:${ag.color};">${escapeHtml(ag.name)}</strong>
            <span class="brain-chip" title="관측된 응답 모델">🧠 ${escapeHtml(brainBadge)}</span>
            <span style="color:#64748b; font-weight:700;">${escapeHtml(ag.badge)}</span>
          </div>
          <div class="msg-content"><div class="msg-bubble">${formatBodyText(messageBodyText(m))}${articleLinkHtml(m)}</div><time class="msg-time" title="${formatTime(m.ts)}">${new Date(Number(m.ts)).toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'})}</time></div>
        </div>
      </div>
    `;
  }

  function upsertMessageToDom(m, options = {}) {
    if (isNoiseMessage(m)) return;
    const mid = String(m.id || `msg-${m.ts}-${m.who}`);
    m.id = mid;
    messageStore.set(mid, m);
    if (document.getElementById('work-records-dialog').open) renderWorkRecords();

    if (m.who && m.who !== 'user') {
      activeTypingMap.delete(m.who);
      renderTypingIndicators();
    }

    if (!isConversationMessage(m)) return;

    // Strict Set-based deduplication: never append an already rendered message ID!
    if (renderedMessageIds.has(mid)) {
      if (options.allowInPlaceUpdate) {
        const existingEl = streamEl.querySelector(`[data-msg-id="${CSS.escape(mid)}"]`);
        if (existingEl) {
          const temp = document.createElement('div');
          temp.innerHTML = buildMessageRowHtml(m).trim();
          const newEl = temp.firstElementChild;
          if (newEl) existingEl.replaceWith(newEl);
        }
      }
      if (!options.initialLoad) sortVisibleMessages();
      applyChatFilters();
      return;
    }

    renderedMessageIds.add(mid);
    const wasNearBottom = isUserNearBottom(100);
    const temp = document.createElement('div');
    temp.innerHTML = buildMessageRowHtml(m).trim();
    const rowEl = temp.firstElementChild;
    if (!rowEl) return;
    streamEl.appendChild(rowEl);
    if (!options.initialLoad) sortVisibleMessages();
    applyChatFilters();

    if (!options.initialLoad && !rowEl.classList.contains('is-hidden-by-filter')) {
      handleSmartScrollOnNewMessage(rowEl, m.who === 'user', wasNearBottom);
    }
  }

  function chronologicalMessages(messages) {
    const sorted = [...messages].sort((a, b) => (Number(a.ts) || 0) - (Number(b.ts) || 0));
    // Equal timestamps retain arrival order except for an explicit request edge.
    // A bounded pass also leaves malformed/cyclic references unable to loop.
    for (let pass = 0; pass < sorted.length; pass++) {
      let changed = false;
      for (let i = 0; i < sorted.length; i++) {
        const parent = sorted[i].parentRequestId;
        const j = parent ? sorted.findIndex(m => (m.eventId || m.id) === parent) : -1;
        if (j > i && Number(sorted[j].ts) === Number(sorted[i].ts) && !sorted[j].parentRequestId) {
          sorted.splice(i, 0, sorted.splice(j, 1)[0]);
          changed = true;
        }
      }
      if (!changed) break;
    }
    return sorted;
  }

  function sortVisibleMessages() {
    const previousTop = streamEl.scrollTop;
    for (const message of chronologicalMessages(messageStore.values())) {
      const row = streamEl.querySelector(`[data-msg-id="${CSS.escape(message.id)}"]`);
      if (row && row !== streamEl.lastElementChild) streamEl.appendChild(row);
    }
    if (followLatest) scheduleFollowLatest();
    else streamEl.scrollTop = previousTop;
  }

  function renderTypingIndicators() {
    document.querySelectorAll('.crew-card').forEach(card => {
      const slug = card.dataset.slug;
      const statusTextEl = card.querySelector('.crew-live-status');
      const tInfo = activeTypingMap.get(slug);
      if (tInfo) {
        card.classList.add('is-typing');
        if (statusTextEl) statusTextEl.textContent = tInfo.typingText || '응답 작성 중...';
      } else {
        card.classList.remove('is-typing');
        if (statusTextEl) statusTextEl.textContent = card.dataset.liveStatus || card.dataset.defaultTitle || '';
      }
    });

    const entries = Array.from(activeTypingMap.values());
    if (!entries.length) {
      typingZoneEl.innerHTML = '';
      return;
    }

    typingZoneEl.innerHTML = entries.map(t => {
      const ag = AGENT_STYLE[t.who] || { name: t.name || t.who, color: t.color || '#2563eb', short: 'A', icon: '🤖' };
      const label = t.typingText || `${ag.icon} ${ag.name}가 응답을 작성하고 있습니다...`;
      return `
        <div class="typing-bubble-row" data-typing-who="${escapeHtml(t.who)}">
          <div class="crew-avatar" style="background:${ag.color}; width:28px; height:28px; font-size:11.5px;">${ag.short}</div>
          <div class="typing-bubble-card">
            <span>${escapeHtml(label)}</span>
            <span class="typing-dots"><span></span><span></span><span></span></span>
          </div>
        </div>
      `;
    }).join('');
  }

  function renderCrewList(agents) {
    const el = document.getElementById('crew-list');
    el.innerHTML = agents.map(a => {
      const bBadge = a.brainBadge || (a.brain && a.brain.badge) || (AGENT_STYLE[a.slug] && AGENT_STYLE[a.slug].defaultBrain) || 'Argon High';
      agentBrainBadgeMap.set(a.slug, bBadge);
      const liveStatus = a.liveTaskStatus || a.title || '';
      const dotColor = a.liveDotColor || '#10b981';
      const isFiltered = (activeAgentFilter === a.slug);
      return `
        <div class="crew-card ${isFiltered ? 'active-filter' : ''}" data-mention="@${a.slug}" data-slug="${a.slug}" data-default-title="${escapeHtml(a.title)}" data-live-status="${escapeHtml(liveStatus)}" title="클릭 시 @${a.slug} 대화·보고만 필터링 (다시 클릭 시 전체 보기)">
          <div class="crew-avatar" style="background:${a.color || '#2563eb'};">
            ${a.name.slice(0, 1)}
            <span class="crew-live-dot" style="background:${dotColor};"></span>
          </div>
          <div class="crew-info">
            <strong>
              <span>${escapeHtml(a.name)}</span>
              <span class="brain-chip" data-brain-for="${escapeHtml(a.slug)}">🧠 ${escapeHtml(bBadge)}</span>
            </strong>
            <small class="crew-live-status">${escapeHtml(liveStatus)}</small>
          </div>
          <button type="button" class="crew-mention-mini" data-insert-mention="@${a.slug}" title="입력창에 @${a.slug} 멘션 넣기">@${a.slug}</button>
        </div>
      `;
    }).join('');

    el.querySelectorAll('.crew-card').forEach(card => {
      card.addEventListener('click', e => {
        const mentionBtn = e.target.closest('[data-insert-mention]');
        if (mentionBtn) {
          e.stopPropagation();
          insertMention(mentionBtn.dataset.insertMention);
          return;
        }
        setAgentFilter(card.dataset.slug);
      });
    });
  }

  function updateCrewLiveStatusInPlace(agents) {
    if (!Array.isArray(agents)) return;
    agents.forEach(a => {
      const bBadge = a.brainBadge || (a.brain && a.brain.badge);
      if (bBadge) agentBrainBadgeMap.set(a.slug, bBadge);
      const card = document.querySelector(`.crew-card[data-slug="${CSS.escape(a.slug)}"]`);
      if (!card) return;
      const liveStatus = a.liveTaskStatus || a.title || '';
      card.dataset.liveStatus = liveStatus;
      if (!activeTypingMap.has(a.slug)) {
        const stEl = card.querySelector('.crew-live-status');
        if (stEl) stEl.textContent = liveStatus;
      }
      const dotEl = card.querySelector('.crew-live-dot');
      if (dotEl && a.liveDotColor) {
        dotEl.style.background = a.liveDotColor;
      }
      const brainEl = card.querySelector('[data-brain-for]');
      if (brainEl && bBadge) {
        brainEl.textContent = `🧠 ${bBadge}`;
      }
    });
  }

  let liveWorkstreamPending = false;
  async function pollLiveWorkstream() {
    if (liveWorkstreamPending || document.hidden) return;
    liveWorkstreamPending = true;
    try {
      const res = await apiFetch('/api/chat/live-workstream', { signal: AbortSignal.timeout(10000) });
      if (!res.ok) return;
      const data = await res.json();
      if (data.kstNow) updateKstClockDisplay(data.kstNow);
      if (Array.isArray(data.agents)) {
        updateCrewLiveStatusInPlace(data.agents);
      }
      if (Array.isArray(data.newWorkstreamMessages) && data.newWorkstreamMessages.length) {
        data.newWorkstreamMessages.forEach(m => upsertMessageToDom(m, { allowInPlaceUpdate: false }));
      }
    } catch (_) {} finally { liveWorkstreamPending = false; }
  }
  setInterval(pollLiveWorkstream, 5000);

  function renderArchiveList(items) {
    document.getElementById('archive-count').textContent = items.length;
    const el = document.getElementById('archive-list');
    if (!items.length) {
      el.innerHTML = '<div style="padding:12px; font-size:12px; color:#94a3b8;">보관된 이전 회의가 없습니다.</div>';
      return;
    }
    el.innerHTML = items.map(item => `
      <div class="archive-item" data-id="${escapeHtml(item.id)}">
        <strong>${item.open ? '🟢 [진행중] ' : '📁 '}${escapeHtml(item.title || item.topic)}</strong>
        <small>${formatTime(item.ts)} · 발언 ${item.count}건 · 클릭 시 복원</small>
      </div>
    `).join('');
    el.querySelectorAll('.archive-item').forEach(row => {
      row.addEventListener('click', async () => {
        const res = await apiFetch('/api/chat/reopen', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: row.dataset.id }),
        });
        if (res.ok) loadRoom(true);
      });
    });
  }

  async function apiFetch(path, options) {
    if (resolvedApiBase) {
      return fetch(resolvedApiBase + path, options);
    }
    // Prioritize Windows Master Hub (192.168.45.248:8790 / 127.0.0.1:8790) where live CDP browsers & agent_tools run
    const candidates = (location.hostname === '192.168.45.190')
      ? ['http://192.168.45.248:8790', 'http://127.0.0.1:8790', 'http://192.168.45.248:8791', '']
      : ['', 'http://127.0.0.1:8790', 'http://192.168.45.248:8790', 'http://127.0.0.1:8791', 'http://192.168.45.248:8791'];
    for (const base of candidates) {
      try {
        const res = await fetch(base + path, options);
        if (res.ok || res.status !== 404) {
          resolvedApiBase = base;
          return res;
        }
      } catch (_) {}
    }
    return fetch(path, options);
  }

  function updateKstClockDisplay(serverKst) {
    const el = document.getElementById('chat-kst-clock');
    if (!el) return;
    if (serverKst) {
      el.textContent = `🕐 KST ${serverKst}`;
      return;
    }
    const now = new Date();
    const kstStr = now.toLocaleString('sv-SE', { timeZone: 'Asia/Seoul' });
    const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const kstDay = dayNames[new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Seoul' })).getDay()];
    el.textContent = `🕐 KST ${kstStr} (${kstDay})`;
  }
  setInterval(() => updateKstClockDisplay(), 1000);
  updateKstClockDisplay();

  async function loadRoom(resetScrollToBottom = false) {
    const res = await apiFetch('/api/chat/room');
    const data = await res.json();
    if (data.kstNow) updateKstClockDisplay(data.kstNow);
    renderCrewList(data.agents || []);
    renderArchiveList(data.archivedMeetings || []);
    if (typeof data.eventSeq === 'number') {
      lastEventSeq = data.eventSeq;
    }
    eventEpoch = data.eventEpoch || '';

    const previousTop = streamEl.scrollTop;
    streamEl.innerHTML = '';
    renderedMessageIds.clear();
    messageStore.clear();
    chronologicalMessages(data.messages || []).forEach(m => upsertMessageToDom(m, { initialLoad: true }));
    applyChatFilters();

    if (resetScrollToBottom) resumeLatestFollow();
    else if (followLatest) scheduleFollowLatest();
    else streamEl.scrollTop = previousTop;
    connectEventStream();
  }

  function connectEventStream() {
    clearTimeout(eventReconnectTimer);
    if (sseSource) {
      try { sseSource.close(); } catch (_) {}
    }
    const base = resolvedApiBase || '';
    try {
      sseSource = new EventSource(`${base}/api/chat/events?since_seq=${lastEventSeq}&since_epoch=${encodeURIComponent(eventEpoch)}`);
      const rememberCursor = e => {
        const parts = String(e.lastEventId || '').split(':');
        if (parts.length === 2 && parts[0] === eventEpoch && Number.isSafeInteger(Number(parts[1]))) {
          lastEventSeq = Math.max(lastEventSeq, Number(parts[1]));
        }
      };
      sseSource.addEventListener('connected', e => {
        try {
          const data = JSON.parse(e.data);
          if (data.reset || (eventEpoch && data.epoch !== eventEpoch)) {
            sseSource.close();
            loadRoom(false).catch(() => { eventReconnectTimer = setTimeout(connectEventStream, 3000); });
            return;
          }
          eventEpoch = data.epoch || eventEpoch;
          lastEventSeq = Number.isSafeInteger(data.seq) ? data.seq : lastEventSeq;
        } catch (_) {}
      });
      sseSource.onerror = () => {
        sseSource.close();
        clearTimeout(eventReconnectTimer);
        eventReconnectTimer = setTimeout(connectEventStream, 3000);
      };
      sseSource.addEventListener('typing', e => {
        rememberCursor(e);
        try {
          const d = JSON.parse(e.data);
          if (d && d.who) {
            if (d.active === false) activeTypingMap.delete(d.who);
            else activeTypingMap.set(d.who, d);
            renderTypingIndicators();
          }
        } catch (_) {}
      });
      sseSource.addEventListener('message', e => {
        rememberCursor(e);
        try {
          const msg = JSON.parse(e.data);
          upsertMessageToDom(msg, { allowInPlaceUpdate: false });
        } catch (_) {}
      });
      sseSource.addEventListener('task_update', e => {
        rememberCursor(e);
        try {
          const msg = JSON.parse(e.data);
          upsertMessageToDom(msg, { allowInPlaceUpdate: true });
        } catch (_) {}
      });
    } catch (_) {}
  }

  function insertMention(tag) {
    const input = document.getElementById('chat-input');
    const cur = input.value;
    if (!cur.includes(tag)) {
      input.value = (tag + ' ' + cur).trim() + ' ';
    }
    input.focus();
  }

  document.querySelectorAll('.mention-pill').forEach(btn => {
    btn.addEventListener('click', () => insertMention(btn.dataset.mention));
  });

  async function sendMessage() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    const btn = document.getElementById('btn-send');
    btn.disabled = true;
    btn.textContent = '응답 중...';

    try {
      const res = await apiFetch('/api/chat/send-stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, includeReactionRound: false }),
      });

      if (!res.body || !res.body.getReader) {
        const data = await res.json();
        (data.newMessages || data.messages || []).forEach(m => upsertMessageToDom(m));
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buffer = '';

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const blocks = buffer.split('\n\n');
        buffer = blocks.pop() || '';

        for (const blk of blocks) {
          const lines = blk.split('\n');
          let evtType = 'message';
          let dataStr = '';
          for (const line of lines) {
            if (line.startsWith('event:')) evtType = line.slice(6).trim();
            else if (line.startsWith('data:')) dataStr += line.slice(5).trim();
          }
          if (!dataStr) continue;
          try {
            const payload = JSON.parse(dataStr);
            if (evtType === 'typing' && payload.who) {
              if (payload.active === false) activeTypingMap.delete(payload.who);
              else activeTypingMap.set(payload.who, payload);
              renderTypingIndicators();
            } else if (evtType === 'message') {
              upsertMessageToDom(payload, { allowInPlaceUpdate: false });
            } else if (evtType === 'task_update') {
              upsertMessageToDom(payload, { allowInPlaceUpdate: true });
            } else if (evtType === 'done') {
              activeTypingMap.clear();
              renderTypingIndicators();
            }
          } catch (_) {}
        }
      }
    } finally {
      activeTypingMap.clear();
      renderTypingIndicators();
      btn.disabled = false;
      btn.textContent = '발언 전송';
    }
  }

  document.getElementById('btn-send').addEventListener('click', sendMessage);
  document.getElementById('chat-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  const btnSreBriefing = document.getElementById('btn-trigger-sre-briefing');
  if (btnSreBriefing) {
    btnSreBriefing.addEventListener('click', async () => {
      btnSreBriefing.disabled = true;
      btnSreBriefing.textContent = '🛡️ 6대 프로젝트 감사 중...';
      pinnedUserRowId = null;
      scrollLockStatusEl.textContent = '🛡️ 6대 전 프로젝트 정례 감사 브리핑 수신 중';
      try {
        await apiFetch('/api/project-health/run-audit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ broadcast: true, runWatchdog: true }),
        });
        await loadRoom(true);
      } finally {
        btnSreBriefing.disabled = false;
        btnSreBriefing.textContent = '🛡️ 6대 전 프로젝트 감사·브리핑';
      }
    });
  }

  document.getElementById('btn-radar-scout').addEventListener('click', async (event) => {
    const button = event.currentTarget;
    button.disabled = true;
    try {
      const response = await apiFetch('/api/chat/radar/scout', { method: 'POST' });
      const out = await response.json();
      if (!response.ok || !out.ok) throw new Error(out.detail || '스카우팅 API 실행 실패');
      scrollLockStatusEl.textContent = out.started ? '🔍 실제 자료 수집 시작 · 채팅 보고 대기' : '🔍 기존 실행 진행 중 또는 중복 실행 방지';
    } catch (error) {
      scrollLockStatusEl.textContent = '스카우팅 미실행: ' + error.message;
    } finally {
      button.disabled = false;
    }
  });

  const btnDoctorPatrol = document.getElementById('btn-trigger-doctor-patrol');
  if (btnDoctorPatrol) {
    btnDoctorPatrol.addEventListener('click', async () => {
      btnDoctorPatrol.disabled = true;
      btnDoctorPatrol.textContent = '🩺 5건 정밀 검진·수술 중...';
      pinnedUserRowId = null;
      scrollLockStatusEl.textContent = '🩺 닥터 7대 정밀 검진 보고 수신 중';
      try {
        await apiFetch('/api/auditor/patrol', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ count: 5, broadcast: true }),
        });
      } finally {
        btnDoctorPatrol.disabled = false;
        btnDoctorPatrol.textContent = '🩺 닥터 5건 즉시 검진·수술';
      }
    });
  }

  document.getElementById('btn-end-meeting').addEventListener('click', async () => {
    const res = await apiFetch('/api/chat/end-meeting', { method: 'POST' });
    const out = await res.json();
    if (out.archived) {
      alert(`회의 결정사항이 기억 그래프(${out.journal})에 시냅스로 연결되고 회의실이 초기화되었습니다.`);
      loadRoom(true);
    } else {
      alert(out.detail || '보관할 대화가 없습니다.');
    }
  });

  document.getElementById('btn-new-meeting').addEventListener('click', async () => {
    const res = await apiFetch('/api/chat/new-meeting', { method: 'POST' });
    await res.json();
    loadRoom(true);
  });

  loadRoom(true);
})();
</script>
</body>
</html>
